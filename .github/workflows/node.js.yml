name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run at 15 mins past midnight on the 15th of every month (avoid high load periods)
    - cron: '15 0 15 * *'
jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Lint files
        run: npm run lint
      - name: Run tests
        run: npm test
